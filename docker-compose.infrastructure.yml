services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledgercore
      POSTGRES_PASSWORD: ledgercore_dev_password
      POSTGRES_DB: ledgercore
    ports:
      - "5434:5432"
    volumes:
      - ledgercore_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgercore -d ledgercore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ledgercore_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ledgercore_pgdata:
  ledgercore_redis_data:
