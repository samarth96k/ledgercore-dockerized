server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API routes
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Banking routes
    location /banking/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payment routes
    # The wallet posts to /payments (without a trailing slash).  A location
    # ending in / does not match that exact URL, so it previously fell through
    # to the React SPA instead of reaching the Express payment endpoint.
    location /payments {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A stale SPA document can reference a JavaScript bundle from a previous
    # deployment. Always revalidate HTML, while allowing content-hashed assets
    # to be cached safely. Importantly, do not return index.html for a missing
    # JavaScript file: that produces a blank React page after a deployment.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Everything else goes to React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
