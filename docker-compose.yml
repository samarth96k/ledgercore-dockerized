services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledgercore
      POSTGRES_PASSWORD: ledgercore_dev_password
      POSTGRES_DB: ledgercore
    volumes:
      - ledgercore_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgercore -d ledgercore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ledgercore_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    volumes:
      - ./backend/simulation-results:/app/simulation-results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    command: npm run jobs:worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  scheduler:
    build:
      context: ./backend
    restart: "no"
    env_file:
      - ./backend/.env.docker
    command: npm run jobs:scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  ledgercore_pgdata:
  ledgercore_redis_data:
